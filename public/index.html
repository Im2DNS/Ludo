<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ludo with Friends</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f5f1;--fg:#222;--card:#fff;--mut:#777;--line:#ddd}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#eee;--card:#2a2a2d;--mut:#999;--line:#444}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;margin:4px 0 8px}
button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#3b7ddd;color:#fff;cursor:pointer;margin:2px}
button.alt{background:var(--line);color:var(--fg)}button:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seat{flex:1 1 45%;border:2px solid;border-radius:10px;padding:6px 8px;font-size:14px}
.seat.on{background:rgba(128,128,128,.18)}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.dice{font-size:44px;line-height:1}.mut{color:var(--mut);font-size:14px}
@keyframes p{50%{opacity:.35}}.mv{animation:p .8s infinite;cursor:pointer}
</style></head><body><div class="wrap">
<h1>🎲 Ludo with Friends</h1><div id="app"></div></div>
<script>
const C=['R','G','Y','B'],COL={R:'#e24b4a',G:'#2fa84f',Y:'#e8b923',B:'#3b7ddd'},NM={R:'Red',G:'Green',Y:'Yellow',B:'Blue'};
const ST={R:0,G:13,Y:26,B:39},SAFE=new Set([0,13,26,39]),U=40;
const RING=[],add=(a,c,r,dc,dr,n)=>{for(let i=0;i<n;i++)a.push([c+dc*i,r+dr*i])};
add(RING,1,6,1,0,5);add(RING,6,5,0,-1,6);add(RING,7,0,1,0,2);add(RING,8,1,0,1,5);add(RING,9,6,1,0,6);add(RING,14,7,0,1,2);add(RING,13,8,-1,0,5);add(RING,8,9,0,1,6);add(RING,7,14,-1,0,2);add(RING,6,13,0,-1,5);add(RING,5,8,-1,0,6);add(RING,0,7,0,-1,2);
const HOME={R:[],G:[],Y:[],B:[]};add(HOME.R,1,7,1,0,5);add(HOME.G,7,1,0,1,5);add(HOME.Y,13,7,-1,0,5);add(HOME.B,7,13,0,-1,5);
const OR={R:[0,0],G:[9,0],Y:[9,9],B:[0,9]},FIN={R:[6.6,7.5],G:[7.5,6.6],Y:[8.4,7.5],B:[7.5,8.4]};
const PIPS=['','⚀','⚁','⚂','⚃','⚄','⚅'];
let G=null,code='',me='',myName='',isHost=false,ws=null,tm=null;
const $=s=>document.getElementById(s);
try{myName=localStorage.getItem('ludo-name')||''}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function lobby(msg){
  G=null;
  $('app').innerHTML=`<div class="card"><b>Play with friends</b><p class="mut">Create a game, then share the 5-letter code. Up to 4 players, no ads, no login.</p>
  <label class="mut" for="nm">1. Enter your name</label>
  <input id="nm" placeholder="Your name" maxlength="14" value="${esc(myName)}">
  <div class="mut" style="margin-top:6px">2. Start a game or join a friend’s</div>
  <button onclick="create()">Create game</button>
  <input id="cd" placeholder="Friend’s game code" maxlength="5" style="text-transform:uppercase;margin-top:12px">
  <button class="alt" onclick="join()">Join game</button><p class="mut">${msg||''}</p></div>
  <div class="card mut">Rules: roll a 1 to bring a token out · a 6 or a capture gives another turn · you must capture when you can · a token can only enter its home lane after you have captured at least once (⚔ shows you can) · rolling 1 three times in a row sends your token nearest home back to base · exact roll needed to finish · only start squares are safe.<br><br>If you refresh the page you keep your seat.</div>`;
}
function nameOk(){const v=($('nm').value||'').trim();if(!v){lobby('Please enter your name first.');return false}myName=v;try{localStorage.setItem('ludo-name',myName)}catch(e){}return true}

/* ---------- networking (server is the referee) ---------- */
try{me=localStorage.getItem('ludo-id')||''}catch(e){}
if(!me){me='p'+Math.random().toString(36).slice(2,12);try{localStorage.setItem('ludo-id',me)}catch(e){}}

/* ---------- sound (synthesized, no files) ---------- */
let AC=null,snd=true;try{snd=localStorage.getItem('ludo-snd')!=='off'}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
['click','touchstart'].forEach(ev=>document.addEventListener(ev,ac,{passive:true}));
function tone(f,t,d,type,v,f2){const a=ac();if(!a||!snd)return;const n=a.currentTime+t,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
  g.gain.setValueAtTime(v||.2,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.02)}
let MS=null;
function out(){const a=ac();if(!a)return null;if(!MS){MS=a.createGain();MS.gain.value=.9;const k=a.createDynamicsCompressor();MS.connect(k);k.connect(a.destination)}return MS}
function nz(a,len){const b=a.createBuffer(1,len,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=Math.random()*2-1;return b}
function hit(t,v,f){
  const a=ac(),o=out();if(!a||!snd||!o)return;const n=a.currentTime+t;
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();
  s.buffer=nz(a,Math.floor(a.sampleRate*.03));bp.type='bandpass';bp.frequency.value=f*2.2;bp.Q.value=.9;
  g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+.03);
  s.connect(bp);bp.connect(g);g.connect(o);s.start(n);
  [[1,1],[2.76,.4],[5.4,.15]].forEach(([r,m])=>{
    const os=a.createOscillator(),gg=a.createGain(),d=.05+.08/r;
    os.frequency.setValueAtTime(f*r*1.04,n);os.frequency.exponentialRampToValueAtTime(f*r,n+.03);
    gg.gain.setValueAtTime(v*m*.8,n);gg.gain.exponentialRampToValueAtTime(.001,n+d);
    os.connect(gg);gg.connect(o);os.start(n);os.stop(n+d+.02)});
}
function swish(t,v){
  const a=ac(),o=out();if(!a||!snd||!o)return;const n=a.currentTime+t,s=a.createBufferSource(),hp=a.createBiquadFilter(),g=a.createGain();
  s.buffer=nz(a,Math.floor(a.sampleRate*.09));hp.type='highpass';hp.frequency.value=3000;
  g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(v,n+.03);g.gain.exponentialRampToValueAtTime(.001,n+.09);
  s.connect(hp);hp.connect(g);g.connect(o);s.start(n);
}
function rollSnd(){
  for(let i=0;i<22;i++)hit(Math.random()*.4,.08+Math.random()*.1,900+Math.random()*1500);
  let t=.38,gap=.12,v=.7;
  for(let i=0;i<7;i++){hit(t,v,1000+Math.random()*700);hit(t+.012,v*.5,1500+Math.random()*600);t+=gap;gap*=.72;v*=.72}
}
function moveSnd(){swish(0,.05);hit(.05,.55,820);hit(.12,.28,640)}
function capSnd(){hit(0,.8,420);hit(.05,.5,300);tone(110,0,.22,'sine',.3,60)}
function winSnd(){[659,784,988,1319].forEach((f,i)=>{const t=i*.15;tone(f,t,.9,'sine',.18);tone(f*2.01,t,.5,'sine',.08);tone(f*3,t,.3,'sine',.04)})}
function sfx(p,g){
  if(!p||p.log===g.log)return;
  if(g.winner&&!p.winner){moveSnd();setTimeout(winSnd,200);return}
  if(/ rolled /.test(g.log))rollSnd();
  else if(JSON.stringify(p.tokens)!==JSON.stringify(g.tokens)){moveSnd();if(/captured/.test(g.log))setTimeout(capSnd,150)}
}
function toggleSnd(){snd=!snd;try{localStorage.setItem('ludo-snd',snd?'on':'off')}catch(e){}if(snd){ac();moveSnd()}draw()}
const wait=m=>{$('app').innerHTML=`<div class="card">${m}</div>`};
const keep=v=>{try{v?localStorage.setItem('ludo-room',v):localStorage.removeItem('ludo-room')}catch(e){}};
function connect(first){
  clearTimeout(tm);
  if(ws){ws.onclose=null;try{ws.close()}catch(e){}}
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  tm=setTimeout(()=>{if(!G)lobby('Could not reach the server. It may be waking up, so wait a minute and try again.')},60000);
  ws.onopen=()=>ws.send(JSON.stringify(first));
  ws.onmessage=e=>{
    clearTimeout(tm);const d=JSON.parse(e.data);
    if(d.err){G=null;keep('');ws.onclose=null;ws.close();return lobby(d.err)}
    if(d.s){const pv=G;G=d.s;code=d.code||code;isHost=G.host===me;keep(code);sfx(pv,G);draw()}
  };
  ws.onclose=()=>{
    if(G){wait('Connection lost. Reconnecting…');setTimeout(()=>connect({t:'join',code,n:myName,id:me}),2000)}
    else{clearTimeout(tm);lobby('Could not connect to the server.')}
  };
}
function create(){if(!nameOk())return;wait('Connecting… (the first connection can take up to a minute)');connect({t:'create',n:myName,id:me})}
function join(){
  if(!nameOk())return;code=($('cd').value||'').trim().toUpperCase();if(code.length<3)return;
  wait('Connecting… (the first connection can take up to a minute)');connect({t:'join',code,n:myName,id:me});
}
function send(d){if(ws&&ws.readyState===1)ws.send(JSON.stringify(d))}
const seated=()=>C.filter(c=>G.seats[c]);
const seatOf=id=>C.find(c=>G.seats[c]===id);

/* ---------- drawing ---------- */
function pos(c,p,i){
  if(p<0)return[OR[c][0]+2+(i%2)*2,OR[c][1]+2+(i>>1)*2];
  if(p<=51){const r=RING[(ST[c]+p)%52];return[r[0]+.5,r[1]+.5]}
  if(p<105){const r=HOME[c][p-100];return[r[0]+.5,r[1]+.5]}
  const f=FIN[c],o=(i-1.5)*.16;return c==='R'||c==='Y'?[f[0],f[1]+o]:[f[0]+o,f[1]];
}
function board(mv){
  let s=`<svg viewBox="0 0 600 600">`;
  C.forEach(c=>{const[x,y]=OR[c];s+=`<rect x="${x*U}" y="${y*U}" width="${6*U}" height="${6*U}" fill="${COL[c]}"/><rect x="${(x+1)*U}" y="${(y+1)*U}" width="${4*U}" height="${4*U}" rx="16" fill="#fff" fill-opacity=".9"/>`;
    for(let i=0;i<4;i++){const q=pos(c,-1,i);s+=`<circle cx="${q[0]*U}" cy="${q[1]*U}" r="15" fill="${COL[c]}" fill-opacity=".25"/>`}
    if(G.seats[c]){const t=(G.phase==='play'&&G.turn===c&&!G.winner?'▶ ':'')+G.names[c]+(G.seats[c]===me?' (you)':'');
      s+=`<text x="${(x+3)*U}" y="${(y+.5)*U}" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width="3" paint-order="stroke">${esc(t)}</text>`}});
  RING.forEach((r,i)=>{const sc=C.find(c=>ST[c]===i);s+=`<rect x="${r[0]*U}" y="${r[1]*U}" width="${U}" height="${U}" fill="${sc?COL[sc]:'#fff'}" stroke="#999"/>`;
    if(SAFE.has(i)&&!sc)s+=`<text x="${r[0]*U+20}" y="${r[1]*U+27}" font-size="20" text-anchor="middle" fill="#999">★</text>`});
  C.forEach(c=>HOME[c].forEach(r=>s+=`<rect x="${r[0]*U}" y="${r[1]*U}" width="${U}" height="${U}" fill="${COL[c]}" stroke="#999"/>`));
  const m=7.5*U,k=6*U,K=9*U;
  s+=`<polygon points="${k},${k} ${k},${K} ${m},${m}" fill="${COL.R}"/><polygon points="${k},${k} ${K},${k} ${m},${m}" fill="${COL.G}"/><polygon points="${K},${k} ${K},${K} ${m},${m}" fill="${COL.Y}"/><polygon points="${k},${K} ${K},${K} ${m},${m}" fill="${COL.B}"/>`;
  const seen={};
  C.forEach(c=>{if(!G.seats[c])return;G.tokens[c].forEach((p,i)=>{
    const q=pos(c,p,i),key=p<0?'b'+c+i:q[0]+','+q[1],n=seen[key]=(seen[key]||0)+1;
    const o=p<0||p>=105?0:(n-1)*.16,can=mv&&c===G.turn&&mv.includes(i);
    s+=`<circle class="${can?'mv':''}" ${can?`onclick="send({t:'move',i:${i}})"`:''} cx="${(q[0]+o)*U}" cy="${(q[1]-o)*U}" r="${p<0?15:p>=105?8:n>1?11:14}" fill="${COL[c]}" stroke="${can?'#000':'#fff'}" stroke-width="${can?4:3}"/>`})});
  return s+'</svg>';
}
function draw(){
  if(!G)return;const my=seatOf(me);
  let h=`<div class="card"><div class="row"><b>Game ${code}</b><span class="mut">share this code with friends</span><button class="alt" style="margin-left:auto" onclick="toggleSnd()">${snd?'🔊 Sound on':'🔇 Sound off'}</button></div><div class="row" style="margin-top:8px">`;
  C.forEach(c=>{const o=G.seats[c];
    h+=`<div class="seat ${G.phase==='play'&&G.turn===c?'on':''}" style="border-color:${COL[c]}">${o?esc(G.names[c])+(o===me?' (you)':'')+(G.cut&&G.cut[c]?' ⚔':''):(G.phase==='lobby'&&!my?`<a href="#" onclick="send({t:'sit',c:'${c}',n:myName});return false" style="color:inherit">Sit as ${NM[c]}</a>`:'<span class="mut">empty</span>')}</div>`});
  h+='</div>';
  if(G.phase==='lobby'){h+=`<p>${G.winner?`🏆 ${esc(G.names[G.winner])} won. `:''}${isHost?`<button onclick="send({t:'start'})" ${seated().length<2?'disabled':''}>Start game</button>`:'<span class="mut">Waiting for the host to start…</span>'}</p></div>`;
    $('app').innerHTML=h;return}
  const myTurn=G.seats[G.turn]===me&&!G.winner,mv=myTurn&&G.rolled?G.mv:null;
  h+=`</div><div class="card">${board(mv)}<div class="row" style="margin-top:10px;justify-content:space-between"><div class="row"><span class="dice" style="color:${G.last?COL[G.last]:'inherit'}">${PIPS[G.dice]||'🎲'}</span><button onclick="send({t:'roll'})" ${myTurn&&!G.rolled?'':'disabled'}>Roll dice</button></div>
  <span class="mut">${G.winner?'':myTurn?'Your turn':esc(G.names[G.turn]||'')+'’s turn'}</span></div><p style="margin:8px 0 0">${esc(G.log)}</p>
  ${G.winner&&isHost?`<button onclick="send({t:'again'})">Play again</button>`:''}</div>`;
  $('app').innerHTML=h;
}
let saved='';try{saved=localStorage.getItem('ludo-room')||''}catch(e){}
lobby();
if(saved&&myName){code=saved;wait('Rejoining your game…');connect({t:'join',code:saved,n:myName,id:me})}
</script></body></html>
