<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo with Friends 🎲</title>
  <style>
    :root { --bg: #f4f4f9; --text: #333; --panel: #fff; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: var(--panel); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
    h1 { margin-top: 0; font-size: 1.8rem; }
    input, button { padding: 10px 15px; margin: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem; outline: none; }
    button { background: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #45a049; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    .hidden { display: none !important; }
    
    /* Lobby */
    .seats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; text-align: left; }
    .seat { padding: 10px; border-radius: 6px; background: #eee; font-weight: bold; }
    .seat.R { border-left: 5px solid #e74c3c; }
    .seat.G { border-left: 5px solid #2ecc71; }
    .seat.Y { border-left: 5px solid #f1c40f; }
    .seat.B { border-left: 5px solid #3498db; }
    
    /* Game Board */
    .board-container { margin: 20px auto; position: relative; width: 320px; height: 320px; background: #fff; border: 2px solid #333; border-radius: 8px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
    .base { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 5px; padding: 10px; }
    .base.R { background: #fadbd8; }
    .base.G { background: #d5f5e3; }
    .base.Y { background: #fcf3cf; }
    .base.B { background: #d6eaf8; }
    .token { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; transition: transform 0.2s; }
    .token:hover { transform: scale(1.2); }
    .token.R { background: #e74c3c; }
    .token.G { background: #2ecc71; }
    .token.Y { background: #f1c40f; color: #333; }
    .token.B { background: #3498db; }
    .token.movable { box-shadow: 0 0 0 3px #fff, 0 0 0 5px #f39c12; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    .controls { margin-top: 20px; display: flex; justify-content: center; gap: 10px; }
    .log { margin-top: 20px; padding: 15px; background: #2c3e50; color: #ecf0f1; border-radius: 6px; font-size: 0.9rem; min-height: 40px; display: flex; align-items: center; justify-content: center; }
    .dice { font-size: 3rem; margin: 10px 0; }

<body>

<div class="container">
  <h1>🎲 Ludo with Friends</h1>

  <!-- JOIN / CREATE SCREEN -->
  <div id="screen-auth">
    <input type="text" id="playerName" placeholder="Your Name" maxlength="14"><br>
    <input type="text" id="roomCodeInput" placeholder="Room Code (to join)" maxlength="5" style="text-transform: uppercase;"><br>
    <button onclick="createRoom()">Create Room</button>
    <button onclick="joinRoom()" style="background:#3498db;">Join Room</button>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="screen-lobby" class="hidden">
    <h2>Room: <span id="displayCode"></span></h2>
    <p>Share this code with friends!</p>
    <div class="seats" id="lobbySeats"></div>
    <button id="btnStart" class="hidden" onclick="send({t:'start'})">Start Game</button>
    <button onclick="send({t:'leave'}); location.reload();" style="background:#e74c3c;">Leave</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="hidden">
    <div class="dice" id="diceDisplay">🎲</div>
    <div class="board-container" id="board">
      <div class="base R" id="base-R"></div>
      <div class="center-board" style="grid-column: span 2; grid-row: span 2; display:flex; align-items:center; justify-content:center; background:#f9f9f9; border:1px solid #ddd;">
        <span style="font-size:2rem;">🏠</span>
      </div>
      <div class="base G" id="base-G"></div>
      <div class="base Y" id="base-Y"></div>
      <div class="base B" id="base-B"></div>
    </div>
    <div class="controls">
      <button id="btnRoll" onclick="send({t:'roll'})">Roll Dice</button>
      <button id="btnAgain" class="hidden" onclick="send({t:'again'})">Play Again</button>
    </div>
    <div class="log" id="gameLog">Waiting for game to start...</div>
  </div>
</div>

<script>
  let ws, myId = Math.random().toString(36).substring(2, 15), myColor = null;
  const DICE_ICONS = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  const COLORS = ['R', 'G', 'Y', 'B'];
  const COLOR_NAMES = { R: 'Red', G: 'Green', Y: 'Yellow', B: 'Blue' };

  function connect(code) {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = () => {
      document.getElementById('screen-auth').classList.add('hidden');
      document.getElementById('screen-lobby').classList.remove('hidden');
      document.getElementById('displayCode').innerText = code;
      send({ t: code ? 'join' : 'create', id: myId, n: document.getElementById('playerName').value || 'Player', code });
    };
    ws.onmessage = e => {
      const data = JSON.parse(e.data);
      if (data.err) return alert(data.err);
      render(data.s, data.code);
    };
    ws.onclose = () => setTimeout(() => location.reload(), 2000);
  }

  function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
  function createRoom() { connect(null); }
  function joinRoom() { 
    const c = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    if (!c) return alert('Enter a room code');
    connect(c); 
  }

  function render(G, code) {
    // Determine my color
    myColor = null;
    COLORS.forEach(c => { if (G.seats[c] === myId) myColor = c; });

    // Switch screens based on phase
    if (G.phase === 'lobby') {
      document.getElementById('screen-lobby').classList.remove('hidden');
      document.getElementById('screen-game').classList.add('hidden');
      
      const seatsDiv = document.getElementById('lobbySeats');
      seatsDiv.innerHTML = '';
      COLORS.forEach(c => {
        const div = document.createElement('div');
        div.className = `seat ${c}`;
        div.innerHTML = `${COLOR_NAMES[c]}: ${G.seats[c] ? G.names[c] + (G.seats[c] === myId ? ' (You)' : '') : '<button onclick="send({t:\'sit\',c:\''+c+'\',n:document.getElementById(\'playerName\').value})">Sit Here</button>'}`;
        seatsDiv.appendChild(div);
      });

      const btnStart = document.getElementById('btnStart');
      if (G.host === myId && Object.values(G.seats).filter(Boolean).length >= 2) {
        btnStart.classList.remove('hidden');
      } else {
        btnStart.classList.add('hidden');
      }
    } else if (G.phase === 'play') {
      document.getElementById('screen-lobby').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      
      // Update Dice
      document.getElementById('diceDisplay').innerText = G.dice ? DICE_ICONS[G.dice] : '🎲';
      
      // Update Log
      document.getElementById('gameLog').innerText = G.log;

      // Update Roll Button
      const btnRoll = document.getElementById('btnRoll');
      const btnAgain = document.getElementById('btnAgain');
      
      if (G.winner) {
        btnRoll.classList.add('hidden');
        if (G.host === myId) btnAgain.classList.remove('hidden');
        else btnAgain.classList.add('hidden');
      } else {
        btnAgain.classList.add('hidden');
        if (G.turn === myColor && !G.rolled) {
          btnRoll.classList.remove('hidden');
          btnRoll.disabled = false;
        } else {
          btnRoll.classList.remove('hidden');
          btnRoll.disabled = true;
          btnRoll.innerText = G.turn === myColor ? "Pick a token" : `${COLOR_NAMES[G.turn]}'s turn`;
        }
      }

      // Render Tokens in Bases (Simplified view for this UI)
      COLORS.forEach(c => {
        const baseDiv = document.getElementById(`base-${c}`);
        baseDiv.innerHTML = '';
        G.tokens[c].forEach((val, i) => {
          const tok = document.createElement('div');
          tok.className = `token ${c}`;
          tok.innerText = i + 1;
          
          // If it's my turn, I've rolled, and this token is movable
          if (G.turn === myColor && G.rolled && G.mv.includes(i)) {
            tok.classList.add('movable');
            tok.onclick = () => send({ t: 'move', i });
          }
          
          // Only show tokens in base or finished for this simplified board
          if (val === -1 || val === 105) {
            baseDiv.appendChild(tok);
          }
        });
      });
    }
  }
</script>
</body>
</html>
